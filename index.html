<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex GBA Master - Ultimate Integration</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0b0e;
            --card-bg: #16161d;
            --accent-color: #ff1f1f;
            --text-main: #e0e0e0;
            --gba-green: #2ecc71;
            /* Type Colors */
            --normal: #A8A77A; --fire: #EE8130; --water: #6390F0; --electric: #F7D02C;
            --grass: #7AC74C; --ice: #96D9D6; --fighting: #C22E28; --poison: #A33EA1;
            --ground: #E2BF65; --flying: #A98FF3; --psychic: #F95587; --bug: #A6B91A;
            --rock: #B6A136; --ghost: #735797; --dragon: #6F35FC; --dark: #705746;
            --steel: #B7B7CE; --fairy: #D685AD;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .navbar-brand { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        /* --- CORREÇÃO DO FILTRO (SCROLL) --- */
        .filter-box {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 40px;
            border: 1px solid #2a2a35;
            position: relative;
            z-index: 100; /* Garante que o dropdown fique por cima dos cards */
        }

        .form-select {
            max-height: 200px; /* Evita que o select exploda a tela em mobile */
            cursor: pointer;
        }

        /* --- CARDS --- */
        #pokedexContainer { min-height: 400px; }
        
        .poke-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            margin-bottom: 25px;
            border: 1px solid #2a2a35;
            height: 100%;
        }

        .poke-card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(255, 31, 31, 0.2); }

        .card-img-container {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
        }

        .poke-img { width: 110px; z-index: 2; transition: 0.3s; }
        .type-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            margin: 2px;
        }

        /* --- MODAL / POPUP --- */
        .modal-content { background-color: var(--card-bg); color: white; border: 1px solid #333; border-radius: 25px; }
        .stat-bar-bg { background: #000; height: 8px; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent-color); width: 0; transition: width 1s; }

        /* Seção de Cheat/Localização no Modal */
        .info-box {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid var(--gba-green);
        }

        .cheat-code {
            font-family: 'Courier New', monospace;
            background: #000;
            color: var(--gba-green);
            padding: 5px;
            font-size: 0.85rem;
            display: block;
            margin-top: 5px;
            border-radius: 4px;
        }

        .evo-item {
            cursor: pointer;
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .evo-item:hover { background: rgba(255,255,255,0.1); }
        .evo-item img { width: 60px; }

        /* Glow Effects por tipo (dinâmico via JS) */
        .glow-fire { border-bottom: 4px solid var(--fire); }
        .glow-water { border-bottom: 4px solid var(--water); }
        .glow-grass { border-bottom: 4px solid var(--grass); }
        .glow-electric { border-bottom: 4px solid var(--electric); }
        /* ... outros tipos mapeados no CSS anterior ... */

        footer { padding: 40px 0; text-align: center; opacity: 0.5; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><span style="color: var(--accent-color);">POKÉ</span>DEX GBA <small style="font-size: 10px;">V2.1</small></a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1 class="display-5 fw-bold">Database GBA Master</h1>
            <p class="text-secondary">Integração Total • Localizações • Cheats</p>
        </div>
    </section>

    <div class="container">
        <div class="filter-box">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="small fw-bold text-secondary">GERAÇÃO</label>
                    <select id="genFilter" class="form-select">
                        <option value="all">Todas (GBA)</option>
                        <option value="1">Kanto (Gen I)</option>
                        <option value="2">Johto (Gen II)</option>
                        <option value="3">Hoenn (Gen III)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold text-secondary">TIPO ELEMENTAL</label>
                    <select id="typeFilter" class="form-select">
                        <option value="all">Todos os Tipos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Elétrico</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Rocha</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="small fw-bold text-secondary">PESQUISAR NOME OU ID</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Ex: Mewtwo...">
                </div>
                <div class="col-md-3 d-grid">
                    <label class="d-none d-md-block">&nbsp;</label>
                    <button class="btn btn-confirm" id="btnConsultar">
                        <i class="fa-solid fa-bolt me-2"></i> CONSULTAR
                    </button>
                </div>
            </div>
        </div>

        <div class="row" id="pokedexContainer">
            </div>
    </div>

    <div class="modal fade" id="pokeDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div id="modalContentArea">
                    </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Dados técnicos providos pela PokéAPI & GBA Database Pro.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
