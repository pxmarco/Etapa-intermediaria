<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex GBA — Master Database</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ══════════════════════════════════════
           DESIGN TOKENS & RESET
        ══════════════════════════════════════ */
        :root {
            --bg:         #080810;
            --surface:    #10101c;
            --surface2:   #181828;
            --border:     #252540;
            --text:       #d8d8f0;
            --muted:      #5a5a80;
            --accent:     #e63946;
            --accent2:    #457b9d;

            /* Type palette */
            --normal:   #9a9a7a; --fire:     #f07030;
            --water:    #6890f0; --electric: #f8d030;
            --grass:    #78c850; --ice:      #98d8d8;
            --fighting: #c03028; --poison:   #a040a0;
            --ground:   #e0c068; --flying:   #a890f0;
            --psychic:  #f85888; --bug:      #a8b820;
            --rock:     #b8a038; --ghost:    #705898;
            --dragon:   #7038f8; --dark:     #705848;
            --steel:    #b8b8d0; --fairy:    #ee99ac;

            --radius: 14px;
            --transition: 0.25s cubic-bezier(.4,0,.2,1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,.12) 2px,
                rgba(0,0,0,.12) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ══════════════════════════════════════
           NAV
        ══════════════════════════════════════ */
        .site-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(8,8,16,.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 60px;
        }

        .nav-brand {
            font-family: 'Press Start 2P', monospace;
            font-size: .7rem;
            color: var(--text);
            text-decoration: none;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .nav-brand span { color: var(--accent); }

        .nav-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: .5rem;
            background: var(--accent);
            color: #fff;
            padding: 3px 7px;
            border-radius: 4px;
        }

        /* ══════════════════════════════════════
           HERO
        ══════════════════════════════════════ */
        .hero {
            padding: 100px 2rem 40px;
            text-align: center;
            position: relative;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(230,57,70,.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(.9rem, 2.5vw, 1.5rem);
            letter-spacing: 3px;
            color: #fff;
            line-height: 2;
        }

        .hero h1 span { color: var(--accent); }

        .hero p {
            margin-top: 12px;
            font-size: .85rem;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-count {
            display: inline-block;
            margin-top: 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: .55rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
        }

        /* ══════════════════════════════════════
           FILTER PANEL
        ══════════════════════════════════════ */
        .filter-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin: 0 0 32px;
            position: relative;
            z-index: 200;
        }

        .filter-label {
            font-family: 'Press Start 2P', monospace;
            font-size: .42rem;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .filter-select, .filter-input {
            width: 100%;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-family: 'Exo 2', sans-serif;
            font-size: .85rem;
            outline: none;
            transition: border-color var(--transition);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .filter-select:focus, .filter-input:focus {
            border-color: var(--accent);
        }

        .filter-select option { background: var(--surface2); }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: .8rem;
        }

        .btn-search {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: .5rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-search:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-search:active { transform: translateY(0); }

        .btn-clear {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Exo 2', sans-serif;
            font-size: .8rem;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 6px;
        }

        .btn-clear:hover { color: var(--text); border-color: var(--muted); }

        /* Active filter chips */
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: .72rem;
            color: var(--text);
        }

        .filter-chip button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: .65rem;
            padding: 0;
            line-height: 1;
        }

        /* ══════════════════════════════════════
           GRID & CARDS
        ══════════════════════════════════════ */
        #pokedexGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            min-height: 300px;
        }

        .poke-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
            animation: fadeUp .35s ease both;
            position: relative;
        }

        .poke-card:hover {
            transform: translateY(-6px);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-type-bar {
            height: 4px;
            width: 100%;
        }

        .card-img-wrap {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-img-glow {
            position: absolute;
            inset: 0;
            opacity: .18;
            background: radial-gradient(circle at center, var(--type-clr, #fff) 0%, transparent 70%);
        }

        .card-img-wrap img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            transition: transform var(--transition);
            image-rendering: auto;
        }

        .poke-card:hover .card-img-wrap img { transform: scale(1.08); }

        .card-body-inner {
            padding: 10px 12px 14px;
        }

        .card-num {
            font-family: 'Press Start 2P', monospace;
            font-size: .4rem;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
        }

        .card-name {
            font-weight: 800;
            font-size: 1rem;
            text-transform: capitalize;
            color: #fff;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-types {
            margin-top: 7px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .type-pill {
            font-size: .62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 2px 8px;
            border-radius: 20px;
            color: #fff;
        }

        /* ══════════════════════════════════════
           SPINNER / EMPTY STATE
        ══════════════════════════════════════ */
        .loader-wrap {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            gap: 20px;
        }

        .gba-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-label {
            font-family: 'Press Start 2P', monospace;
            font-size: .5rem;
            color: var(--muted);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 0;
            color: var(--muted);
        }

        .empty-state i { font-size: 2.5rem; margin-bottom: 16px; opacity: .4; }

        .empty-state p {
            font-family: 'Press Start 2P', monospace;
            font-size: .5rem;
            line-height: 2;
        }

        /* ══════════════════════════════════════
           MODAL
        ══════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: popIn .28s cubic-bezier(.175,.885,.32,1.275) both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(.88); }
            to   { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 50%;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: .9rem;
            transition: all var(--transition);
        }

        .modal-close:hover { color: var(--text); border-color: var(--text); }

        .modal-header-band {
            height: 6px;
            width: 100%;
            border-radius: 20px 20px 0 0;
        }

        .modal-hero {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px 28px 0;
            flex-wrap: wrap;
        }

        .modal-img-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .modal-img-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            opacity: .2;
            filter: blur(30px);
        }

        .modal-img-wrap img {
            width: 150px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 20px rgba(255,255,255,.1));
        }

        .modal-id-name .modal-num {
            font-family: 'Press Start 2P', monospace;
            font-size: .5rem;
            color: var(--muted);
        }

        .modal-id-name h2 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: capitalize;
            color: #fff;
            margin: 6px 0 10px;
        }

        .modal-body-inner { padding: 20px 28px 28px; }

        /* stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-top: 20px;
        }

        .stat-row { display: flex; flex-direction: column; gap: 4px; }

        .stat-meta {
            display: flex;
            justify-content: space-between;
            font-size: .75rem;
        }

        .stat-name {
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            font-size: .65rem;
        }

        .stat-val { font-weight: 800; color: #fff; }

        .stat-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1s cubic-bezier(.4,0,.2,1);
        }

        /* info boxes */
        .info-section {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
        }

        .info-box-title {
            font-family: 'Press Start 2P', monospace;
            font-size: .42rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .info-box-title i { font-size: .7rem; }

        .info-item {
            font-size: .8rem;
            color: var(--text);
            line-height: 1.7;
        }

        .info-item strong {
            color: var(--muted);
            font-weight: 600;
            font-size: .7rem;
            text-transform: uppercase;
            display: block;
        }

        /* cheat codes */
        .cheat-grid { display: flex; flex-direction: column; gap: 8px; }

        .cheat-entry { }

        .cheat-label {
            font-size: .65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 3px;
        }

        .cheat-code {
            font-family: 'Press Start 2P', monospace;
            font-size: .45rem;
            background: #000;
            color: #00ff88;
            padding: 7px 10px;
            border-radius: 6px;
            display: block;
            letter-spacing: 1px;
            line-height: 1.8;
            user-select: all;
            border: 1px solid #00ff8820;
        }

        /* evolution chain */
        .evo-section {
            margin-top: 22px;
        }

        .evo-title {
            font-family: 'Press Start 2P', monospace;
            font-size: .42rem;
            color: var(--muted);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 16px;
        }

        .evo-chain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .evo-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all var(--transition);
            min-width: 80px;
        }

        .evo-node:hover { background: var(--surface2); border-color: var(--border); }
        .evo-node.active { border-color: var(--accent); background: rgba(230,57,70,.08); }

        .evo-node img { width: 64px; height: 64px; object-fit: contain; }

        .evo-node-name {
            font-size: .7rem;
            font-weight: 700;
            text-transform: capitalize;
            color: var(--text);
            text-align: center;
        }

        .evo-node-num {
            font-family: 'Press Start 2P', monospace;
            font-size: .35rem;
            color: var(--muted);
        }

        .evo-trigger {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--muted);
            font-size: .65rem;
        }

        .evo-trigger i { font-size: .75rem; }

        .evo-trigger span {
            font-size: .6rem;
            text-align: center;
            max-width: 70px;
            line-height: 1.4;
        }

        /* physical details */
        .phys-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .phys-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: .78rem;
        }

        .phys-pill i { color: var(--muted); font-size: .75rem; }

        /* scrollbar */
        .modal-box::-webkit-scrollbar { width: 4px; }
        .modal-box::-webkit-scrollbar-track { background: transparent; }
        .modal-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ══════════════════════════════════════
           RESULTS COUNT
        ══════════════════════════════════════ */
        .results-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: .8rem;
        }

        .results-count {
            color: var(--muted);
        }

        .results-count strong { color: var(--text); }

        /* ══════════════════════════════════════
           FOOTER
        ══════════════════════════════════════ */
        footer {
            text-align: center;
            padding: 40px 0;
            font-family: 'Press Start 2P', monospace;
            font-size: .4rem;
            color: var(--muted);
            line-height: 2.5;
        }

        /* ══════════════════════════════════════
           RESPONSIVE
        ══════════════════════════════════════ */
        @media (max-width: 600px) {
            .stats-grid    { grid-template-columns: 1fr; }
            .info-section  { grid-template-columns: 1fr; }
            .modal-hero    { flex-direction: column; align-items: flex-start; }
            .modal-img-wrap img { width: 110px; }
            #pokedexGrid   { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }

        /* Util */
        .d-none { display: none !important; }
    </style>
</head>
<body>

<!-- NAV -->
<nav class="site-nav">
    <a class="nav-brand" href="#"><span>POKÉ</span>DEX</a>
    <span class="nav-badge">GBA</span>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-bg"></div>
    <h1>GBA <span>MASTER</span><br>DATABASE</h1>
    <p>Kanto · Johto · Hoenn · Pokémon de GBA</p>
    <span class="hero-count" id="heroCount">CARREGANDO...</span>
</section>

<!-- MAIN -->
<main class="container" style="max-width:1200px; padding-bottom:60px;">

    <!-- FILTER PANEL -->
    <div class="filter-panel">
        <div class="row g-3 align-items-end">
            <!-- Jogo -->
            <div class="col-sm-6 col-md-3">
                <label class="filter-label">Jogo</label>
                <div class="select-wrapper">
                    <select id="gameFilter" class="filter-select">
                        <option value="all">Todos os Jogos</option>
                        <option value="red-blue">🔴 Red / Blue</option>
                        <option value="yellow">💛 Yellow</option>
                        <option value="gold-silver">🥇 Gold / Silver</option>
                        <option value="crystal">💎 Crystal</option>
                        <option value="ruby-sapphire">💎 Ruby / Sapphire</option>
                        <option value="emerald">🌿 Emerald</option>
                        <option value="firered-leafgreen">🔥 FireRed / LeafGreen</option>
                    </select>
                </div>
            </div>

            <!-- Geração -->
            <div class="col-sm-6 col-md-2">
                <label class="filter-label">Geração</label>
                <div class="select-wrapper">
                    <select id="genFilter" class="filter-select">
                        <option value="all">Todas</option>
                        <option value="1">Gen I</option>
                        <option value="2">Gen II</option>
                        <option value="3">Gen III</option>
                    </select>
                </div>
            </div>

            <!-- Tipo -->
            <div class="col-sm-6 col-md-2">
                <label class="filter-label">Tipo</label>
                <div class="select-wrapper">
                    <select id="typeFilter" class="filter-select">
                        <option value="all">Todos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Elétrico</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Pedra</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                    </select>
                </div>
            </div>

            <!-- Search -->
            <div class="col-sm-6 col-md-3">
                <label class="filter-label">Pesquisar</label>
                <input type="text" id="searchInput" class="filter-input" placeholder="Nome ou número...">
            </div>

            <!-- Buttons -->
            <div class="col-md-2">
