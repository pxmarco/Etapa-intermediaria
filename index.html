<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex GBA Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0b0e; --card-bg: #16161d; --accent: #ff1f1f; --text: #e0e0e0;
            --fire: #EE8130; --water: #6390F0; --grass: #7AC74C; --electric: #F7D02C;
            --ice: #96D9D6; --fighting: #C22E28; --poison: #A33EA1; --ground: #E2BF65;
            --flying: #A98FF3; --psychic: #F95587; --bug: #A6B91A; --rock: #B6A136;
            --ghost: #735797; --dragon: #6F35FC; --dark: #705746; --steel: #B7B7CE;
            --fairy: #D685AD; --normal: #A8A77A;
        }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Roboto', sans-serif; }
        .filter-box { background: var(--card-bg); border-radius: 15px; padding: 20px; border: 1px solid #2a2a35; margin-top: 100px; }
        .form-control, .form-select { background: #0b0b0e; border: 1px solid #333; color: #fff; }
        .poke-card { 
            background: var(--card-bg); border-radius: 15px; padding: 15px; transition: 0.3s; 
            cursor: pointer; border: 1px solid #222; text-align: center; height: 100%;
        }
        .poke-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .poke-img { width: 100px; height: 100px; object-fit: contain; }
        .type-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; color: #fff; margin: 2px; display: inline-block; }
        .modal-content { background: var(--card-bg); color: #fff; border-radius: 20px; border: 1px solid #444; }
        .stat-bar { background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .stat-fill { background: var(--accent); height: 100%; transition: width 1s; }
        .evo-item { cursor: pointer; padding: 10px; border-radius: 10px; transition: 0.2s; }
        .evo-item:hover { background: rgba(255,255,255,0.1); }
        /* Glow classes */
        .glow-fire { border-bottom: 3px solid var(--fire); } .glow-water { border-bottom: 3px solid var(--water); }
        .glow-grass { border-bottom: 3px solid var(--grass); } .glow-electric { border-bottom: 3px solid var(--electric); }
        .glow-ice { border-bottom: 3px solid var(--ice); } .glow-fighting { border-bottom: 3px solid var(--fighting); }
        .glow-poison { border-bottom: 3px solid var(--poison); } .glow-ground { border-bottom: 3px solid var(--ground); }
        .glow-flying { border-bottom: 3px solid var(--flying); } .glow-psychic { border-bottom: 3px solid var(--psychic); }
        .glow-bug { border-bottom: 3px solid var(--bug); } .glow-rock { border-bottom: 3px solid var(--rock); }
        .glow-ghost { border-bottom: 3px solid var(--ghost); } .glow-dragon { border-bottom: 3px solid var(--dragon); }
        .glow-dark { border-bottom: 3px solid var(--dark); } .glow-steel { border-bottom: 3px solid var(--steel); }
        .glow-fairy { border-bottom: 3px solid var(--fairy); } .glow-normal { border-bottom: 3px solid var(--normal); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark fixed-top bg-dark border-bottom border-danger">
        <div class="container"><a class="navbar-brand fw-bold" href="#">POKÉDEX GBA</a></div>
    </nav>
 
    <div class="container">
        <div class="filter-box">
            <div class="row g-2">
                <div class="col-md-3">
                    <select id="genFilter" class="form-select">
                        <option value="1">Kanto (FireRed/LeafGreen)</option>
                        <option value="2">Johto (Gold/Silver GBA)</option>
                        <option value="3">Hoenn (Ruby/Sapphire/Emerald)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="typeFilter" class="form-select">
                        <option value="all">Todos os Tipos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Elétrico</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Pedra</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Nome ou número...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-danger w-100" onclick="triggerSearch()">CONSULTAR</button>
                </div>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-md-4 g-3 mt-4" id="pokedexContainer"></div>
    </div>
 
    <div class="modal fade" id="pokeModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
