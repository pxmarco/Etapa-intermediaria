<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex API</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px;
      border: none;
      border-radius: 6px;
    }

    button {
      cursor: pointer;
      background: #e63946;
      color: white;
    }

    #pokedexContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .type {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #333;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <h1>Pokédex API</h1>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Nome ou ID">

    <select id="typeFilter">
      <option value="all">Todos</option>
      <option value="fire">Fogo</option>
      <option value="water">Água</option>
      <option value="grass">Planta</option>
      <option value="electric">Elétrico</option>
    </select>

    <button id="btnConsultar">Buscar</button>
  </div>

  <div id="pokedexContainer"></div>

  <script src="script.js"></script>

</body>
</html>
