<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex GBA Master - Dark Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0b0e;
            --card-bg: #16161d;
            --accent-color: #ff1f1f;
            --text-main: #e0e0e0;
            --gba-green: #2ecc71;
            /* Pokemon Type Colors */
            --normal: #A8A77A; --fire: #EE8130; --water: #6390F0; --electric: #F7D02C;
            --grass: #7AC74C; --ice: #96D9D6; --fighting: #C22E28; --poison: #A33EA1;
            --ground: #E2BF65; --flying: #A98FF3; --psychic: #F95587; --bug: #A6B91A;
            --rock: #B6A136; --ghost: #735797; --dragon: #6F35FC; --dark: #705746;
            --steel: #B7B7CE; --fairy: #D685AD;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        h1, h2, h3, .navbar-brand { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .navbar { background-color: rgba(11, 11, 14, 0.95); border-bottom: 2px solid var(--accent-color); backdrop-filter: blur(10px); }
        .hero-section { padding: 100px 0 50px; background: linear-gradient(180deg, rgba(255,31,31,0.1) 0%, rgba(11,11,14,1) 100%); text-align: center; }
        .filter-box { background: var(--card-bg); border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 40px; border: 1px solid #2a2a35; }
        .form-select, .form-control { background-color: #0b0b0e; border: 1px solid #333; color: white; transition: all 0.3s; }
        .form-select:focus, .form-control:focus { background-color: #1a1a24; border-color: var(--accent-color); color: white; box-shadow: 0 0 10px rgba(255, 31, 31, 0.3); }
        .btn-confirm { background: var(--accent-color); border: none; color: white; font-weight: bold; text-transform: uppercase; height: 100%; border-radius: 8px; transition: 0.3s; }
        .btn-confirm:hover { background: #cc1919; box-shadow: 0 0 15px rgba(255, 31, 31, 0.5); }
        .poke-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; position: relative; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s; cursor: pointer; margin-bottom: 30px; border: 1px solid #2a2a35; }
        .poke-card:hover { transform: translateY(-10px); box-shadow: 0 15px 45px rgba(0,0,0,0.7); }
        .card-img-container { height: 180px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 70%); }
        .poke-img { width: 130px; z-index: 2; transition: 0.3s; }
        .poke-card:hover .poke-img { transform: scale(1.1); }
        .card-info { padding: 20px; text-align: center; }
        .type-badge { padding: 4px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin: 2px; display: inline-block; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* Efeitos Dinâmicos (Glows) */
        .glow-fire { border-bottom: 4px solid var(--fire); } .glow-water { border-bottom: 4px solid var(--water); }
        .glow-grass { border-bottom: 4px solid var(--grass); } .glow-electric { border-bottom: 4px solid var(--electric); }
        .glow-psychic { border-bottom: 4px solid var(--psychic); } .glow-dragon { border-bottom: 4px solid var(--dragon); }
        .glow-ice { border-bottom: 4px solid var(--ice); } .glow-fighting { border-bottom: 4px solid var(--fighting); }
        .glow-poison { border-bottom: 4px solid var(--poison); } .glow-ground { border-bottom: 4px solid var(--ground); }
        .glow-flying { border-bottom: 4px solid var(--flying); } .glow-bug { border-bottom: 4px solid var(--bug); }
        .glow-rock { border-bottom: 4px solid var(--rock); } .glow-ghost { border-bottom: 4px solid var(--ghost); }
        .glow-dark { border-bottom: 4px solid var(--dark); } .glow-steel { border-bottom: 4px solid var(--steel); }
        .glow-fairy { border-bottom: 4px solid var(--fairy); } .glow-normal { border-bottom: 4px solid var(--normal); }

        .modal-content { background-color: var(--card-bg); color: white; border: 1px solid #444; border-radius: 25px; }
        .stat-row { margin-bottom: 10px; }
        .stat-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; display: flex; justify-content: space-between; }
        .stat-bar-bg { background: #0b0b0e; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 4px; }
        .stat-bar-fill { height: 100%; background: var(--accent-color); border-radius: 5px; width: 0; transition: width 1s ease-in-out; }
        .evo-cycle-container { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; margin-top: 20px; }
        footer { padding: 50px 0; text-align: center; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><span style="color: var(--accent-color);">POKÉ</span>DEX GBA</a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold">Database GBA Master</h1>
            <p class="lead opacity-75">Design Original • Analytics Avançado</p>
        </div>
    </section>

    <div class="container">
        <div class="filter-box">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label small text-secondary fw-bold">GERAÇÃO</label>
                    <select id="genFilter" class="form-select">
                        <option value="all">Todas</option>
                        <option value="1">Gen I</option>
                        <option value="2">Gen II</option>
                        <option value="3">Gen III</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-secondary fw-bold">JOGO GBA</label>
                    <select id="gameFilter" class="form-select">
                        <option value="all">Qualquer</option>
                        <option value="frlg">FireRed / LeafGreen</option>
                        <option value="rse">Ruby / Sapphire / Emerald</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-secondary fw-bold">TIPO ELEMENTAL</label>
                    <select id="typeFilter" class="form-select">
                        <option value="all">Todos os Tipos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Elétrico</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Rocha</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-secondary fw-bold">PESQUISAR</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Nome ou ID...">
                </div>
                <div class="col-md-2 d-grid">
                    <label class="form-label d-none d-md-block">&nbsp;</label>
                    <button class="btn btn-confirm" onclick="triggerSearch()">
                        <i class="fa-solid fa-check-circle me-2"></i> CONSULTAR
                    </button>
                </div>
            </div>
        </div>

        <div class="row" id="pokedexContainer"></div>
    </div>

    <div class="modal fade" id="pokeDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" id="modalContentArea"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PokéDex GBA Master. Dados via PokéAPI.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
